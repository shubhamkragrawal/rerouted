name: Rerouted CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true
          python-version: "3.11"
      - name: Install locked dependencies
        run: uv sync --frozen --extra dev --extra data
      - name: Lint
        run: uv run ruff check .
      - name: Type check
        run: uv run mypy api core domains ui scripts local_app
      - name: Tests and regression gates
        run: uv run pytest
