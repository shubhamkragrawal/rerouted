services:
  api:
    build: .
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment:
      REROUTED_ENV: local
      REROUTED_CONFIG_PATH: /app/config/default.yaml
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data:ro

  ui:
    build: .
    command: streamlit run ui/app.py --server.address 0.0.0.0 --server.port 8501
    environment:
      REROUTED_API_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      api:
        condition: service_started
